services:
  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - DEBUG=0
    volumes:
      - "./scripts/localstack:/etc/localstack/init/ready.d"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=conveyor
      - POSTGRES_PASSWORD=conveyor
      - POSTGRES_DB=conveyor
    volumes:
      - conveyor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor -d conveyor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conveyor-pgdata:
